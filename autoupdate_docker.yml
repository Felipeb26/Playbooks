```yaml
---
- name: Update All
  hosts: media
  become: true

  tasks:
    - name: Find Compose files
      ansible.builtin.find:
        paths:
          - /opt
          - /srv
          - /home
          - /root
        patterns:
          - "compose.y*ml"
          - "docker-compose.y*ml"
        recurse: true
      register: compose_files

    - name: Show Compose files
      ansible.builtin.debug:
        msg: "{{ item.path }}"
      loop: "{{ compose_files.files }}"

    - name: Pull latest images
      ansible.builtin.command:
        cmd: docker compose -f "{{ item.path }}" pull
      loop: "{{ compose_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Recreate Compose projects
      ansible.builtin.command:
        cmd: docker compose -f "{{ item.path }}" up -d --remove-orphans
      loop: "{{ compose_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove unused Docker images
      ansible.builtin.command:
        cmd: docker image prune -f
```
